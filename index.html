<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Azera Control</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* FUNDO */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&w=1600&q=80") no-repeat center center;
  background-size: cover;
  filter: brightness(0.35);
  z-index: -1;
}

/* CARD */
.card {
  width: 340px;
  padding: 25px;
  text-align: center;
  background: rgba(0,0,0,0.65);
  border-radius: 15px;
  backdrop-filter: blur(10px);
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
}

/* BOTÃO */
button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #555;
  color: white;
  cursor: not-allowed;
}

button.active {
  background: #00c853;
  cursor: pointer;
}

.hidden {
  display: none;
}

/* BARRA */
.barra {
  width: 100%;
  height: 18px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

#progresso {
  height: 100%;
  width: 0%;
  background: green;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="card" id="login">

  <h1>🚗 Azera Control</h1>

  <input type="password" id="senha">
  <button onclick="entrar()">Entrar</button>

  <p id="erro"></p>

</div>

<!-- APP -->
<div class="card hidden" id="app">

  <!-- STEP 1 -->
  <div id="step1">
    <p>Faturamento bruto diário</p>
    <input type="number" id="fat">
    <button id="btn1" onclick="next(1)">Próximo</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="hidden">
    <p>Combustível</p>
    <input type="number" id="comb">
    <button id="btn2" onclick="next(2)">Próximo</button>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="hidden">
    <p>Alimentação</p>
    <input type="number" id="alim">
    <button id="btn3" onclick="next(3)">Próximo</button>
  </div>

  <!-- STEP 4 (NOVO) -->
  <div id="step4" class="hidden">
    <p>Despesas pessoais</p>
    <input type="number" id="pessoal">
    <button onclick="finalizar()">Finalizar</button>
  </div>

  <!-- RESULTADO -->
  <h3 id="resultado"></h3>

  <!-- META -->
  <h4>🎯 Progresso</h4>
  <div class="barra">
    <div id="progresso"></div>
  </div>

  <p id="porcentagem">0%</p>
  <p id="status"></p>

</div>

<script>

const senhaCorreta = "129501";
const meta = 50000;
let total = 0;

/* LOGIN */
function entrar() {
  let s = document.getElementById("senha").value;

  if (s === senhaCorreta) {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  } else {
    document.getElementById("erro").innerText = "Senha incorreta";
  }
}

/* BOTÕES ATIVOS */
document.addEventListener("input", function(e){

  if(e.target.id === "fat") {
    document.getElementById("btn1").classList.add("active");
  }

  if(e.target.id === "comb") {
    document.getElementById("btn2").classList.add("active");
  }

  if(e.target.id === "alim") {
    document.getElementById("btn3").classList.add("active");
  }

});

/* ETAPAS */
function next(step){

  if(step === 1){
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
  }

  if(step === 2){
    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step3").classList.remove("hidden");
  }

  if(step === 3){
    document.getElementById("step3").classList.add("hidden");
    document.getElementById("step4").classList.remove("hidden");
  }
}

/* FINAL */
function finalizar(){

  let fat = Number(document.getElementById("fat").value || 0);
  let comb = Number(document.getElementById("comb").value || 0);
  let alim = Number(document.getElementById("alim").value || 0);
  let pessoal = Number(document.getElementById("pessoal").value || 0);

  let lucro = fat - comb - alim;

  let guardado = lucro - pessoal;

  if(guardado > 0){
    total += guardado;
  }

  let porcentagem = (total / meta) * 100;

  document.getElementById("resultado").innerText =
    "Lucro do dia: R$ " + lucro;

  document.getElementById("porcentagem").innerText =
    porcentagem.toFixed(1) + "%";

  document.getElementById("progresso").style.width =
    porcentagem + "%";

  let status = "";

  if(porcentagem >= 80){
    status = "🟢 Verde - ótimo ritmo";
    document.getElementById("progresso").style.background = "green";
  }
  else if(porcentagem >= 50){
    status = "🟡 Amarelo - atenção";
    document.getElementById("progresso").style.background = "yellow";
  }
  else{
    status = "🔴 Vermelho - fora da meta";
    document.getElementById("progresso").style.background = "red";
  }

  document.getElementById("status").innerText = status;
}

</script>

</body>
</html>

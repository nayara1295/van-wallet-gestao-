<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Azera Control</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

/* FUNDO */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&w=1600&q=80") no-repeat center center;
  background-size: cover;
  filter: brightness(0.35);
  z-index: -1;
}

/* CARD */
.card {
  width: 340px;
  padding: 25px;
  text-align: center;
  background: rgba(0,0,0,0.65);
  border-radius: 15px;
  backdrop-filter: blur(10px);
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  outline: none;
}

/* BOTÃO BASE */
button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #555;
  color: white;
  cursor: not-allowed;
  transition: 0.3s;
}

button.active {
  background: #00c853;
  cursor: pointer;
}

button:hover.active {
  background: #00e676;
}

/* BOTÕES FINAIS */
#salvarBtn {
  background: #2196f3;
  cursor: pointer;
}

#fecharBtn {
  background: #e53935;
  cursor: pointer;
}

#infoBtn {
  background: #9c27b0;
  cursor: pointer;
}

/* ETAPAS */
.hidden {
  display: none;
}

/* BARRA */
.barra {
  width: 100%;
  height: 18px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

#progresso {
  height: 100%;
  width: 0%;
  background: green;
}

/* CALENDÁRIO */
#calendar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);

  display: none;
  justify-content: center;
  align-items: center;
}

#calendar .card {
  background: #1a1a1a;
}

.dia {
  padding: 8px;
  margin: 5px 0;
  border-radius: 6px;
}

.verde { background: #1b5e20; }
.amarelo { background: #f9a825; color: black; }
.vermelho { background: #b71c1c; }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="card" id="login">

  <h1>🚗 Azera Control</h1>

  <input type="password" id="senha">
  <button onclick="entrar()">Entrar</button>

  <p id="erro"></p>

</div>

<!-- APP -->
<div class="card hidden" id="app">

  <!-- STEP 1 -->
  <div id="step1">
    <p>Faturamento bruto diário</p>
    <input type="number" id="fat">
    <button id="btn1" onclick="next(1)">Próximo</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="hidden">
    <p>Combustível</p>
    <input type="number" id="comb">
    <button id="btn2" onclick="next(2)">Próximo</button>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="hidden">
    <p>Alimentação</p>
    <input type="number" id="alim">
    <button id="btn3" onclick="next(3)">Próximo</button>
  </div>

  <!-- STEP 4 -->
  <div id="step4" class="hidden">
    <p>Despesas pessoais</p>
    <input type="number" id="pessoal">
    <button onclick="finalizar()">Finalizar</button>
  </div>

  <!-- RESULTADOS -->
  <h3 id="resultado"></h3>
  <h4 id="depositado"></h4>

  <!-- BARRA -->
  <div class="barra">
    <div id="progresso"></div>
  </div>

  <p id="porcentagem">0%</p>
  <p id="status"></p>

  <!-- BOTÕES -->
  <button id="salvarBtn" onclick="salvar()">💾 Salvar</button>
  <button id="fecharBtn" onclick="fechar()">❌ Fechar</button>
  <button id="infoBtn" onclick="abrirCalendario()">📅 Info</button>

</div>

<!-- CALENDÁRIO -->
<div id="calendar">
  <div class="card">

    <h3>📅 Histórico de Dias</h3>

    <div id="listaDias"></div>

    <button onclick="fecharCalendario()">Fechar</button>

  </div>
</div>

<script>

const senhaCorreta = "129501";
const meta = 50000;

/* LOGIN */
function entrar() {
  let s = document.getElementById("senha").value;

  if (s === senhaCorreta) {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  } else {
    document.getElementById("erro").innerText = "Senha incorreta";
  }
}

/* ETAPAS */
function next(step){

  if(step === 1){
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
  }

  if(step === 2){
    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step3").classList.remove("hidden");
  }

  if(step === 3){
    document.getElementById("step3").classList.add("hidden");
    document.getElementById("step4").classList.remove("hidden");
  }
}

/* FINAL */
function finalizar(){

  let fat = Number(document.getElementById("fat").value || 0);
  let comb = Number(document.getElementById("comb").value || 0);
  let alim = Number(document.getElementById("alim").value || 0);
  let pessoal = Number(document.getElementById("pessoal").value || 0);

  let lucro = fat - comb - alim;
  let depositado = lucro - pessoal;

  document.getElementById("resultado").innerText =
    "Lucro do dia: R$ " + lucro;

  document.getElementById("depositado").innerText =
    "Depositado hoje: R$ " + depositado;

  let porcentagem = (depositado / meta) * 100;

  document.getElementById("porcentagem").innerText =
    porcentagem.toFixed(2) + "%";

  document.getElementById("progresso").style.width =
    porcentagem + "%";

  let status = "";

  if(porcentagem >= 80){
    status = "🟢 Verde - ótimo dia";
    document.getElementById("progresso").style.background = "green";
  }
  else if(porcentagem >= 50){
    status = "🟡 Amarelo - atenção";
    document.getElementById("progresso").style.background = "yellow";
  }
  else{
    status = "🔴 Vermelho - baixo desempenho";
    document.getElementById("progresso").style.background = "red";
  }

  document.getElementById("status").innerText = status;
}

/* SALVAR */
function salvar() {

  let depositado = document.getElementById("depositado").innerText;

  let historico = JSON.parse(localStorage.getItem("azera")) || [];

  historico.push({
    data: new Date().toLocaleDateString(),
    valor: depositado
  });

  localStorage.setItem("azera", JSON.stringify(historico));

  alert("Salvo com sucesso!");
}

/* FECHAR */
function fechar() {
  document.body.innerHTML = "<h2 style='text-align:center;color:white'>App fechado</h2>";
}

/* CALENDÁRIO */
function abrirCalendario() {

  document.getElementById("calendar").style.display = "flex";

  let dados = JSON.parse(localStorage.getItem("azera")) || [];

  let html = "";

  dados.forEach(d => {

    let valor = Number((d.valor || "0").replace(/[^\d]/g, ""));

    let cor = "vermelho";

    if(valor >= 100) cor = "verde";
    else if(valor >= 50) cor = "amarelo";

    html += `
      <div class="dia ${cor}">
        📅 ${d.data} — R$ ${valor}
      </div>
    `;
  });

  document.getElementById("listaDias").innerHTML = html || "Sem registros";
}

function fecharCalendario() {
  document.getElementById("calendar").style.display = "none";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Azera Control</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* FUNDO AZERA */
body::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background: url("azera.jpg") no-repeat center center;
  background-size: cover;

  filter: brightness(0.35);
  z-index: -1;
}

/* CARD CENTRAL */
.card {
  width: 320px;
  padding: 30px;
  border-radius: 15px;
  text-align: center;

  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);

  color: white;
}

h1 {
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  outline: none;

  background: rgba(255,255,255,0.1);
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;

  background: #00c853;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #00e676;
}

#error {
  margin-top: 10px;
  color: #ff5252;
}
</style>

</head>

<body>

<div class="card">

  <h1>🚗 Azera Control</h1>
  <p>Digite sua senha</p>

  <input type="password" id="senha" placeholder="••••••••">

  <button onclick="entrar()">Entrar</button>

  <div id="error"></div>

</div>

<script>
const senhaCorreta = "129501";

function entrar() {
  const senha = document.getElementById("senha").value;

  if (senha === senhaCorreta) {
    alert("Login ok");
  } else {
    document.getElementById("error").innerText = "Senha incorreta";
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Azera Control</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  /* fundo bonito */
  background: linear-gradient(135deg, #000000, #1a1a1a);
  color: white;
}

/* cartão central */
.card {
  width: 300px;
  padding: 30px;
  border-radius: 15px;
  text-align: center;

  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

/* título */
h1 {
  margin-bottom: 10px;
}

/* input */
input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  outline: none;

  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 16px;
}

/* botão */
button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;

  background: #00c853;
  color: white;
  font-weight: bold;
  font-size: 16px;

  cursor: pointer;
}

button:hover {
  background: #00e676;
}

/* erro */
#error {
  margin-top: 10px;
  color: #ff5252;
  font-size: 14px;
}
</style>

</head>

<body>

<div class="card">

  <h1>🚗 Azera Control</h1>
  <p>Digite sua senha</p>

  <input type="password" id="senha" placeholder="••••••••">

  <button onclick="entrar()">Entrar</button>

  <div id="error"></div>

</div>

<script>
const senhaCorreta = "129501";

function entrar() {
  const senha = document.getElementById("senha").value;

  if (senha === senhaCorreta) {
    alert("Login ok (próxima tela vem depois)");
  } else {
    document.getElementById("error").innerText = "Senha incorreta";
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Azera Control</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* FUNDO AZERA */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&w=1600&q=80") no-repeat center center;
  background-size: cover;
  filter: brightness(0.35);
  z-index: -1;
}

/* CARD */
.card {
  width: 340px;
  padding: 25px;
  text-align: center;
  background: rgba(0,0,0,0.65);
  border-radius: 15px;
  backdrop-filter: blur(10px);
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
}

/* BOTÃO CINZA */
button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #555;
  color: white;
  cursor: not-allowed;
}

/* BOTÃO VERDE */
button.active {
  background: #00c853;
  cursor: pointer;
}

/* etapas */
.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="card" id="login">

  <h1>🚗 Azera Control</h1>
  <p>Digite sua senha</p>

  <input type="password" id="senha">
  <button onclick="entrar()">Entrar</button>

  <p id="erro"></p>

</div>

<!-- APP -->
<div class="card hidden" id="app">

  <!-- STEP 1 -->
  <div id="step1">
    <p>Faturamento bruto diário</p>
    <input type="number" id="fat">
    <button id="btn1" onclick="next(1)">Próximo</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="hidden">
    <p>Combustível</p>
    <input type="number" id="comb">
    <button id="btn2" onclick="next(2)">Próximo</button>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="hidden">
    <p>Alimentação</p>
    <input type="number" id="alim">
    <button id="btn3" onclick="finalizar()">Finalizar</button>
  </div>

  <h3 id="resultado"></h3>

</div>

<script>

const senhaCorreta = "129501";

/* LOGIN */
function entrar() {
  let s = document.getElementById("senha").value;

  if (s === senhaCorreta) {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  } else {
    document.getElementById("erro").innerText = "Senha incorreta";
  }
}

/* BOTÕES ATIVOS */
document.addEventListener("input", function(e){

  if(e.target.id === "fat") {
    document.getElementById("btn1").classList.add("active");
  }

  if(e.target.id === "comb") {
    document.getElementById("btn2").classList.add("active");
  }

  if(e.target.id === "alim") {
    document.getElementById("btn3").classList.add("active");
  }

});

/* ETAPAS */
function next(step){

  if(step === 1){
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
  }

  if(step === 2){
    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step3").classList.remove("hidden");
  }
}

/* FINAL */
function finalizar(){

  let fat = Number(document.getElementById("fat").value || 0);
  let comb = Number(document.getElementById("comb").value || 0);
  let alim = Number(document.getElementById("alim").value || 0);

  let lucro = fat - comb - alim;

  document.getElementById("resultado").innerText =
    "Lucro do dia: R$ " + lucro;
}

</script>

</body>
</html>

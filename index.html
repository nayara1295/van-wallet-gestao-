<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Azera Control</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* FUNDO COM URL */
body::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background: url("https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&w=1600&q=80") no-repeat center center;
  background-size: cover;

  filter: brightness(0.45);
  z-index: -1;
}

/* CARD */
.card {
  width: 320px;
  padding: 30px;
  text-align: center;

  background: rgba(0,0,0,0.65);
  border-radius: 15px;
  backdrop-filter: blur(10px);
  color: white;
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;

  background: rgba(255,255,255,0.1);
  color: white;
  outline: none;
}

/* BOTÃO */
button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;

  background: #00c853;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #00e676;
}

/* ERRO */
#error {
  margin-top: 10px;
  color: #ff5252;
  font-size: 13px;
}
</style>

</head>

<body>

<div class="card">

  <h1>🚗 Azera Control</h1>

  <input type="password" id="senha" placeholder="Senha">

  <button onclick="entrar()">Entrar</button>

  <div id="error"></div>

</div>

<script>
const senhaCorreta = "129501";

function entrar() {
  const senha = document.getElementById("senha").value;

  if (senha === senhaCorreta) {
    alert("Login OK");
  } else {
    document.getElementById("error").innerText = "Senha incorreta";
  }
}
</script>

</body>
</html>

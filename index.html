<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Azera Control</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  width: 320px;
  text-align: center;
  background: #1a1a1a;
  padding: 25px;
  border-radius: 15px;
}

/* inputs */
input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
}

/* botão padrão (cinza) */
button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #555;
  color: white;
  cursor: not-allowed;
  transition: 0.3s;
}

/* botão ativo (verde) */
button.active {
  background: #00c853;
  cursor: pointer;
}

button.active:hover {
  background: #00e676;
}

/* esconder campos */
.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="card">

  <h2>🚗 Azera Control</h2>

  <!-- FATURAMENTO -->
  <div id="step1">
    <p>Faturamento bruto diário</p>
    <input type="number" id="fat">
    <button id="btn1" onclick="nextStep(1)">Próximo</button>
  </div>

  <!-- COMBUSTÍVEL -->
  <div id="step2" class="hidden">
    <p>Combustível</p>
    <input type="number" id="comb">
    <button id="btn2" onclick="nextStep(2)">Próximo</button>
  </div>

  <!-- ALIMENTAÇÃO -->
  <div id="step3" class="hidden">
    <p>Alimentação</p>
    <input type="number" id="alim">
    <button id="btn3" onclick="finalizar()">Finalizar</button>
  </div>

  <h3 id="status"></h3>

</div>

<script>

// ativa botão quando digitar valor
document.getElementById("fat").addEventListener("input", function(){
  document.getElementById("btn1").classList.add("active");
  document.getElementById("btn1").disabled = false;
});

document.getElementById("comb").addEventListener("input", function(){
  document.getElementById("btn2").classList.add("active");
  document.getElementById("btn2").disabled = false;
});

document.getElementById("alim").addEventListener("input", function(){
  document.getElementById("btn3").classList.add("active");
  document.getElementById("btn3").disabled = false;
});

function nextStep(step) {

  if (step === 1) {
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
  }

  if (step === 2) {
    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step3").classList.remove("hidden");
  }
}

function finalizar() {

  let fat = Number(document.getElementById("fat").value || 0);
  let comb = Number(document.getElementById("comb").value || 0);
  let alim = Number(document.getElementById("alim").value || 0);

  let lucro = fat - comb - alim;

  document.getElementById("status").innerText =
    "Lucro do dia: R$ " + lucro;
}
</script>

</body>
</html>
